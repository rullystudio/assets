<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Sederhana</title>
<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
    }

    /* Navbar */
    .navbar{
        background:#333;
        color:#fff;
        padding:10px 20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .navbar .menu a{
        color:#fff;
        margin-right:15px;
        text-decoration:none;
    }

    /* Layout utama */
    .container{
        display:flex;
        height:400px;
        padding:10px;
        gap:10px;
        box-sizing:border-box;
    }

    .left, .right{
        flex:1;
        display:flex;
        flex-direction:column;
        gap:10px;
    }

    .box{
        background:#e3e3e3;
        padding:15px;
        text-align:center;
        border-radius:5px;
        flex:1;
    }

    /* Bagian bawah full width */
    .footer-box{
        background:#ccc;
        padding:20px;
        text-align:center;
        margin:10px;
        border-radius:5px;
    }

</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="profile">
        <strong>Account</strong>
    </div>
</div>

<!-- Layout Utama -->
<div class="container">
    <div class="left">
        <div class="box">Kiri Atas</div>
        <div class="box">Kiri Bawah</div>
    </div>

    <div class="right">
        <div class="box">Kanan Atas</div>
        <div class="box">Kanan Bawah</div>
    </div>
</div>

<!-- Full width bawah -->
<div class="footer-box">
    Bagian Bawah Full Width (col-12)
</div>

</body>
</html>
