<script>
function initPage() {

    const app = Vue.createApp({
        data() {
            return {
                kategori: [],
                userLogged: false
            };
        },
        created() {
            fetch("http://localhost/api/kategori")
                .then(res => res.json())
                .then(res => this.kategori = res);
        }
    });

    app.mount("#app");
    
    console.log("Vue sudah jalan setelah include selesai");
}
</script>
