<script>
// Include HTML recursive + callback final
function includeHTML(callback) {
    let elements = document.querySelectorAll("[include-html]");
    let total = elements.length;
    if (total === 0) {
        callback();
        return;
    }

    elements.forEach(el => {
        let file = el.getAttribute("include-html");
        fetch(file)
            .then(resp => resp.text())
            .then(data => {
                el.innerHTML = data;
                el.removeAttribute("include-html");

                // setelah replace, mungkin masih ada include di dalamnya
                includeHTML(callback);
            });
    });
}

// jalankan pada DOM ready
document.addEventListener("DOMContentLoaded", function() {
    includeHTML(function() {
        console.log("SEMUA INCLUDE SELESAI");

        // Setelah semua include selesai, baru jalankan script halaman
        if (typeof initPage === "function") {
            initPage();
        }
    });
});
</script>
